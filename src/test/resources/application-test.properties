# Ustawienia dla testów zespołu (@ActiveProfiles("test")): baza H2 w pamięci (osobna dla każdego kontekstu),
# bez konsoli H2 i bez wypisywania SQL, żeby logi testów były czytelne.
# Uwaga: NIE tworzymy src/test/resources/application.properties, bo zasłoniłby plik z src/main
# i reguły kursu (R1.02, R1.03) uruchomiłyby aplikację bez data.sql.
# LOCK_TIMEOUT=10000: test równoległych spinów czeka na blokadę portfela do 10 s (domyślnie H2 czeka 1 s)
spring.datasource.url=jdbc:h2:mem:kasyno-test-${random.uuid};DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.main.banner-mode=off
logging.level.root=WARN
# licznik zapytań SQL (test „brak N+1” w InvestorQuestionsRepositoryTest)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
