spring.application.name=wdtb-2026-backend-kasyno

# ---------------------------------------------------------------
# Profile (LAB 06). Ten plik to ustawienia wspólne, dokładnie jak w szablonie kursu. Profil wybiera się
# zmienną SPRING_PROFILES_ACTIVE albo argumentem --spring.profiles.active=...; bez wyboru działa "dev".
#   dev  (domyślny)  jak szablon: H2 w pliku ./data, tabele od nowa przy każdym starcie, data.sql, konsola H2
#   demo             nagrywanie filmików: H2 w pamięci, nagłówek X-Demo-Seed, ratunek co minutę
#   prod             hosting (Docker, Render.com): trwała baza (ddl-auto=update), data.sql tylko przy pustej bazie
# Szczegóły: application-<profil>.properties i docs/obrona/00-uruchomienie.md.
# ---------------------------------------------------------------
spring.profiles.default=dev

# ---------------------------------------------------------------
# Baza danych (domyślnie): H2 zapisywana do pliku
# ./data/wdtb.mv.db (katalog jest w .gitignore). Nic nie trzeba instalować.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/wdtb;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Konsola: http://localhost:8080/h2-console  (JDBC URL jak wyżej)
spring.h2.console.enabled=true

# ---------------------------------------------------------------
# Schemat tworzy Hibernate na podstawie encji przy każdym starcie
# (create-drop: tabele są tworzone od nowa, więc dane z poprzedniego uruchomienia znikają).
# Dane startowe są w src/main/resources/data.sql i wczytują się po utworzeniu tabel.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.open-in-view=false
# Błąd w DDL zatrzymuje start aplikacji (domyślnie Hibernate tylko go loguje i tabela po cichu nie powstaje).
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# data.sql zawiera polskie znaki (np. „Złoty Faraon”), więc czytamy go zawsze jako UTF-8.
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------
# Cebulion Casino: reguły biznesowe (rekord pl.wsb.kasyno.shared.config.CasinoProperties).
# Każdą wartość można nadpisać w profilu albo zmienną środowiskową: kropki → _, bez myślników, wielkie litery,
# np. kasyno.rescue-cooldown → KASYNO_RESCUECOOLDOWN=5m.
# ---------------------------------------------------------------
# bonus powitalny przy pierwszym logowaniu (cebuliony)
kasyno.welcome-bonus=10000
# bonus ratunkowy dla bankruta (saldo < najmniejszy zakład) i minimalny odstęp między bonusami
kasyno.rescue-amount=10000
kasyno.rescue-cooldown=10m
# od ilu krotności zakładu wygrana trafia do feedu "duże wygrane" w lobby
kasyno.big-win-multiplier=15
kasyno.nick.min-length=3
kasyno.nick.max-length=16
# nazwy zastrzeżone (porównanie całej nazwy, bez wielkości liter, polskich znaków, _ i -)
kasyno.nick.reserved-names=admin,administrator,moderator,mod,root,system,support,pomoc,obsluga,krupier,kasyno,\
  cebulion,cebulioncasino,pancebulion,bank,null,undefined,anonim,anonymous,gosc,guest
# fragmenty niedozwolone w dowolnym miejscu nazwy (wulgaryzmy i obraźliwe słowa)
kasyno.nick.forbidden-words=kurw,chuj,huj,pizd,jeba,jebi,jebn,jebac,zjeb,pierdol,pierdal,spierd,skurw,cipa,cipk,\
  dziwk,szmat,pedal,cwel,kutas,fiut,fuck,shit,bitch,nigg,hitler,nazi

# Feed i ranking w lobby: wynik zapytania trzymany w pamięci do pierwszej zmiany danych (zdarzenie po commicie),
# najdłużej tyle (pas bezpieczeństwa); 0s wyłącza pamięć podręczną
kasyno.lobby.cache-ttl=30s

# Zadania cykliczne (@Scheduled, LAB 06); cron Springa ma 6 pól: sekunda minuta godzina dzień miesiąc dzień-tygodnia (UTC)
kasyno.schedule.enabled=true
# migawka gospodarki do logu: o każdej pełnej godzinie
kasyno.schedule.economy-snapshot-cron=0 0 * * * *
# zapominanie kluczy Idempotency-Key starszych niż idempotency-key-ttl: co godzinę, w 30. minucie
kasyno.schedule.idempotency-cleanup-cron=0 30 * * * *
kasyno.schedule.idempotency-key-ttl=24h
spring.task.scheduling.thread-name-prefix=kasyno-cron-

# Nagłówek X-Demo-Seed (ziarno rundy) przyjmowany tylko w profilu demo; tu zawsze false
kasyno.demo.allow-seed=false
# Wczytanie data.sql tylko przy pustej bazie: potrzebne przy trwałej bazie (profil prod); tu robi to Spring Boot
kasyno.starter-data.load-when-empty=false

# ---------------------------------------------------------------
# Sesja gracza: ciasteczko HttpOnly (niedostępne dla JavaScriptu), SameSite=Lax (ochrona przed CSRF),
# ważne 7 dni; sesja po stronie serwera wygasa po 7 dniach bezczynności. Identyfikator sesji tylko
# w ciasteczku, nigdy w adresie URL (;jsessionid=...).
# ---------------------------------------------------------------
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=7d
server.servlet.session.tracking-modes=cookie

# ---------------------------------------------------------------
# Kompresja gzip odpowiedzi tekstowych (HTML, CSS, JS, JSON, SVG); obrazy WebP i wideo są już skompresowane.
# ---------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,\
  application/problem+json,image/svg+xml
server.compression.min-response-size=1KB

# ---------------------------------------------------------------
# Odpowiedzi błędów: nigdy nie pokazujemy klientowi stack trace ani komunikatów wyjątków
# (pełne informacje są w logu serwera). Cache /assets/** ustawia pl.wsb.kasyno.shared.config.WebConfig.
# ---------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
spring.web.resources.cache.use-last-modified=true

# ---------------------------------------------------------------
# Dokumentacja API (springdoc): Swagger UI pod /swagger-ui.html, opis OpenAPI pod /v3/api-docs
# ---------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
