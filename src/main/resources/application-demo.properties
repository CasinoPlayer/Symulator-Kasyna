# ---------------------------------------------------------------
# Profil "demo": nagrywanie filmików do lobby (plan projektu § 7) i pokaz na obronie.
# Uruchomienie: mvn spring-boot:run -Dspring-boot.run.profiles=demo
#           albo java -jar target/*.jar --spring.profiles.active=demo
# ---------------------------------------------------------------

# Baza H2 w pamięci: każdy start to ta sama, świeża baza z data.sql, więc nagranie da się powtórzyć 1:1
# i nie nadpisujemy pliku ./data/wdtb z profilu dev. Konsola H2: JDBC URL jak niżej, użytkownik sa, hasło puste.
spring.datasource.url=jdbc:h2:mem:kasyno-demo;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.h2.console.enabled=true
# czytelny log podczas nagrywania (bez wypisywania każdego zapytania SQL)
spring.jpa.show-sql=false

# Nagłówek X-Demo-Seed w POST /api/slots/{code}/spins: ziarno rundy = podane (szesnastkowo, jak pole "seed"
# w odpowiedzi), zamiast losowego z SecureRandom. Skrypt nagrywający wybiera tak rundy z wygraną i darmowymi spinami.
# TYLKO w tym profilu; w dev i prod nagłówek jest ignorowany (test: DemoSeedTest).
kasyno.demo.allow-seed=true

# Pokaz bonusu ratunkowego bez czekania 10 minut
kasyno.rescue-cooldown=1m

# Migawka gospodarki co minutę (w dev/prod co godzinę), żeby na obronie było widać @Scheduled w logu
kasyno.schedule.economy-snapshot-cron=0 * * * * *
