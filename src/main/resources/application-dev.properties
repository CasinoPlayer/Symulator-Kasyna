# ---------------------------------------------------------------
# Profil "dev": domyślny (spring.profiles.default=dev w application.properties), czyli praca na zajęciach
# i obrona w IntelliJ. Zachowuje się DOKŁADNIE jak szablon kursu, więc reguły (mvn verify -Dlab=N) widzą
# aplikację taką, jaką znają:
#   * baza H2 w pliku ./data/wdtb (konsola H2 pod /h2-console, użytkownik sa, hasło puste),
#   * tabele od nowa przy każdym starcie (create-drop), więc salda i gracze znikają po restarcie,
#   * data.sql wczytywany przy każdym starcie (konta zespołu i trzy automaty),
#   * zapytania SQL wypisywane w konsoli (widać, co generuje Hibernate),
#   * nagłówek X-Demo-Seed ignorowany (ziarno rundy zawsze z SecureRandom).
#
# Celowo NIE powtarzamy tu ustawień z application.properties: instrukcje laboratoriów każą zmieniać
# application.properties, a wpis w tym pliku po cichu by je nadpisywał (plik profilu ma pierwszeństwo).
# Różnice względem serwera są w application-prod.properties, a względem nagrywania w application-demo.properties.
# ---------------------------------------------------------------
kasyno.demo.allow-seed=false
