# ---------------------------------------------------------------
# Profil "prod": aplikacja na serwerze (Docker, Render.com). Włącza go zmienna SPRING_PROFILES_ACTIVE=prod
# (ustawiona w Dockerfile i render.yaml) albo argument --spring.profiles.active=prod.
#
# Najważniejsza różnica względem dev: baza PRZETRWA restart. Hibernate tylko dodaje brakujące tabele i kolumny
# (ddl-auto=update), a data.sql (konta zespołu, trzy automaty) wczytuje się wyłącznie przy pierwszym starcie
# na pustej bazie (klasa pl.wsb.kasyno.shared.config.StarterDataLoader). Dzięki temu salda graczy zostają.
# ---------------------------------------------------------------

# Port: Render.com (i inne hostingi) podają go w zmiennej PORT; lokalnie i w Dockerze domyślnie 8080
server.port=${PORT:8080}

# Baza domyślna: H2 w pliku. Katalog z zmiennej KASYNO_DATA_DIR (w obrazie Dockera /app/data), lokalnie ./data.
# Osobny plik niż w dev (kasyno-prod zamiast wdtb), żeby start w dev (create-drop) nie skasował danych z prod.
# Inna baza bez zmiany kodu: zmienne środowiskowe SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD (mają pierwszeństwo przed tym plikiem), np. PostgreSQL:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/kasyno  (sterownik org.postgresql jest w pom.xml)
spring.datasource.url=jdbc:h2:file:${KASYNO_DATA_DIR:./data}/kasyno-prod;DATABASE_TO_LOWER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
kasyno.starter-data.load-when-empty=true

# Konsola H2 wyłączona: na serwerze dawałaby dostęp do całej bazy przez przeglądarkę
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Za serwerem pośredniczącym hostingu (HTTPS kończy się na nim): nagłówki X-Forwarded-* mówią, że gracz łączy się
# przez https, a ciasteczko sesji ma flagę Secure (przeglądarka wyśle je tylko przez https; localhost też się liczy)
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
# Przy wdrożeniu nowej wersji serwer kończy rozpoczęte żądania (np. spin), zamiast je zrywać
server.shutdown=graceful

kasyno.demo.allow-seed=false
